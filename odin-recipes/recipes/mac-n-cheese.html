    <h2>Ingredients</h2>
    <ol>
        <li>Cheese</li>
        <li>Noodles</li>
        <li>Heavy cream</li>
        <li>Butter</li>
    </ol>

    <h2>Preparation</h2>
    <ul>
        <li>Boil noodles until al dente</li>
        <li>Drain water</li>
        <li>Add a dollop of butter and a bit of heavy cream</li>
        <li>Stir in cheese on low heat and until fully melted</li>
        <li>Serve</li>
    
    </ul>
